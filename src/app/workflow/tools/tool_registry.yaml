schema_version: '2.0'
registry_type: tool_registry
description: Python Tool 파일에서 AST로 추출한 함수 호출 정보다. Registry에 등록된 Tool은 모두 Workflow에서 사용할 수 있다.
generation:
  method: python_ast
  llm_used: false
  source_root: app/workflow/tools
tools:
  data_load:
    category: data_io
    function_name: data_load
    source: data_io/data_load.py
    signature: 'data_load(parquet_path: str=None)'
    docstring: |-
      Parquet 파일을 pandas DataFrame으로 불러옵니다.

      Args:
          parquet_path: 불러올 Parquet 파일의 경로입니다.

      Returns:
          불러온 pandas DataFrame입니다.
    inputs:
      parquet_path:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: null
    returns:
      type: null
      outputs:
        result:
          selector: $
    packages:
    - pandas
  extract_data:
    category: data_io
    function_name: extract_data
    source: data_io/extract_data.py
    signature: 'extract_data(data_type: str, lot_cd: str, process: list | str, query_mode: str, start_dt:
      str | None, end_dt: str | None, wafer_list: list | None, title: list | str | None=None, symbol:
      list | str | None=None, bin: list | str | int | None=None, device: list | str | None=None, owner:
      list | str | None=None, program: list | str | None=None, equip: list | str | None=None, limit: int
      | None=None, **kwargs: object) -> dict[str, object]'
    docstring: |-
      Accept the customer extraction arguments and return a placeholder result.

      This function deliberately performs no file or DataLake access. It only
      preserves the planned call/return contract until the customer implementation
      replaces it. The following transform Tool supplies local wide mock data.

      Args:
          data_type: 데이터 종류 (KGSD, NCE, PKT, TDBI, WIS, WT_BIN_PARA,
              WT_ITEM_PARA, WT_SYMBOL). 필수.
          lot_cd: Lot 코드. 필수.
          process: 공정 목록 또는 공정명. 필수.
          query_mode: 조회 방식 (period 또는 wafer_list). 필수.
          start_dt: 조회 시작일. 필수 인자이며 wafer_list 조회에서는 None 전달.
          end_dt: 조회 종료일. 필수 인자이며 wafer_list 조회에서는 None 전달.
          wafer_list: Wafer ID 목록. 필수 인자이며 period 조회에서는 None 전달.
          title: Title 필터. 선택.
          symbol: Symbol 필터. 선택.
          bin: Bin 필터. 선택.
          device: Device 필터. 선택.
          owner: Owner 필터. 선택.
          program: Program 필터. 선택.
          equip: 설비 필터. 선택.
          limit: 조회 행 제한. 선택.
          kwargs: 고객 구현에서 사용하는 추가 조회 조건. 선택.

      Returns:
          추출 결과 placeholder와 전달된 query_params.
    inputs:
      data_type:
        type: str
        kind: positional_or_keyword
        has_default: false
        default: null
      lot_cd:
        type: str
        kind: positional_or_keyword
        has_default: false
        default: null
      process:
        type: list | str
        kind: positional_or_keyword
        has_default: false
        default: null
      query_mode:
        type: str
        kind: positional_or_keyword
        has_default: false
        default: null
      start_dt:
        type: str | None
        kind: positional_or_keyword
        has_default: false
        default: null
      end_dt:
        type: str | None
        kind: positional_or_keyword
        has_default: false
        default: null
      wafer_list:
        type: list | None
        kind: positional_or_keyword
        has_default: false
        default: null
      title:
        type: list | str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      symbol:
        type: list | str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      bin:
        type: list | str | int | None
        kind: positional_or_keyword
        has_default: true
        default: null
      device:
        type: list | str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      owner:
        type: list | str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      program:
        type: list | str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      equip:
        type: list | str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      limit:
        type: int | None
        kind: positional_or_keyword
        has_default: true
        default: null
      kwargs:
        type: object
        kind: var_keyword
        has_default: false
        default: null
    returns:
      type: dict[str, object]
      outputs:
        data:
          selector: '["data"]'
        metadata:
          selector: '["metadata"]'
        preview_data:
          selector: '["preview_data"]'
        shape:
          selector: '["shape"]'
        columns:
          selector: '["columns"]'
        cache_status:
          selector: '["cache_status"]'
        file_path:
          selector: '["file_path"]'
        data_type:
          selector: '["data_type"]'
        query_params:
          selector: '["query_params"]'
        cache_key:
          selector: '["cache_key"]'
    packages: []
  transform_data:
    category: data_io
    function_name: transform_data
    source: data_io/transform_data.py
    signature: 'transform_data(data_type: str, data: dict, transform_op: str | None=None, mock_data_dir:
      str=''/workspace/pv/data'') -> dict[str, object]'
    docstring: |-
      Return NCE or WT symbol data in the existing wide output contract.

      Args:
          data_type: Supported types are nce and wt_symbol.
          data: Input from extract_data.data; accepted for compatibility but ignored.
          transform_op: Operation label for testing; defaults to pivot for NCE
              and wt_fail_pivot for WT. No production pivot is performed.
          mock_data_dir: Directory containing the existing wide mock Parquet files.

      Returns:
          {"data": dict, "shape": list, "columns": list, "transform_info": dict}
    inputs:
      data_type:
        type: str
        kind: positional_or_keyword
        has_default: false
        default: null
      data:
        type: dict
        kind: positional_or_keyword
        has_default: false
        default: null
      transform_op:
        type: str | None
        kind: positional_or_keyword
        has_default: true
        default: null
      mock_data_dir:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: /workspace/pv/data
    returns:
      type: dict[str, object]
      outputs:
        data:
          selector: '["data"]'
        shape:
          selector: '["shape"]'
        columns:
          selector: '["columns"]'
        transform_info:
          selector: '["transform_info"]'
    packages:
    - pandas
  boxplot_eda:
    category: eda
    function_name: boxplot_eda
    source: eda/boxplot_eda.py
    signature: 'boxplot_eda(data: object, output_dir: str=''artifacts/plots'', figsize: tuple | list=(6,
      5), dpi: int=150) -> dict[str, object]'
    docstring: |-
      데이터프레임의 각 수치형 컬럼에 대해 Boxplot을 생성합니다.
      Args:
          data: pandas DataFrame (또는 dict 컬럼-배열 형식)
          output_dir: Boxplot 이미지를 저장할 디렉터리 (예: artifacts/plots)
          figsize: 그래프 크기. 기본 (6, 5)
          dpi: 저장 이미지 해상도. 기본 150

      Returns:
          {"boxplot_paths": list} - 생성된 Boxplot 이미지 파일 경로 리스트
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: false
        default: null
      output_dir:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: artifacts/plots
      figsize:
        type: tuple | list
        kind: positional_or_keyword
        has_default: true
        default:
        - 6
        - 5
      dpi:
        type: int
        kind: positional_or_keyword
        has_default: true
        default: 150
    returns:
      type: dict[str, object]
      outputs:
        boxplot_paths:
          selector: '["boxplot_paths"]'
    packages:
    - matplotlib
    - pandas
  compare_failure_normal:
    category: eda
    function_name: compare_failure_normal
    source: eda/compare_failure_normal.py
    signature: 'compare_failure_normal(data: object, target_column: str=None, feature_columns: list=None,
      positive_label: int=1, output_dir: str=''artifacts/metrics'') -> dict[str, object]'
    docstring: |-
      불량/정상 그룹 간 수치 feature 분포를 통계적으로 비교합니다.
      Args:
          data: pnadas DataFrame 또는 dict 컬럼-배열 형식
          target_column: 불량 여부 컬럼명
          feature_columns: 비교할 수치형 컬럼 리스트 (None이면 전체 수치형)
          positive_label: 불량(양성) 값 (기본 1)
          output_dir: 통계 JSON을 저장할 디렉터리 (예: artifacts/metrics)
      Returns:
          {"feature_stats": dict, "mannwhitney_pvalues": dict, "effect_sizes": dict,
           "artifact_path": str}
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: false
        default: null
      target_column:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: null
      feature_columns:
        type: list
        kind: positional_or_keyword
        has_default: true
        default: null
      positive_label:
        type: int
        kind: positional_or_keyword
        has_default: true
        default: 1
      output_dir:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: artifacts/metrics
    returns:
      type: dict[str, object]
      outputs:
        feature_stats:
          selector: '["feature_stats"]'
        mannwhitney_pvalues:
          selector: '["mannwhitney_pvalues"]'
        effect_sizes:
          selector: '["effect_sizes"]'
        artifact_path:
          selector: '["artifact_path"]'
    packages:
    - numpy
    - pandas
    - scipy
  compute_statistics:
    category: eda
    function_name: compute_statistics
    source: eda/compute_statistics.py
    signature: 'compute_statistics(data: object, columns: list=None, output_dir: str | None=None) -> dict[str,
      object]'
    docstring: "데이터프레임의 각 컬럼에 대해 기본 통계량을 계산\nArgs: \n    data: pandas DataFrame 객체 또는 dict 컬럼-배열 형식\n\
      \    columns: 통계량을 계산할 컬럼 목록. None이면 모든 수치형/범주형 컬럼.\n    output_dir: 통계 JSON 저장 경로. None이면 파일을 저장하지\
      \ 않습니다.\nReturns:\n    {\"statistics\": dict} - 컬럼별 통계량 (수치형: describe, 범주형: count/unique/top/freq)"
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: false
        default: null
      columns:
        type: list
        kind: positional_or_keyword
        has_default: true
        default: null
      output_dir:
        type: str | None
        kind: positional_or_keyword
        has_default: true
        default: null
    returns:
      type: dict[str, object]
      outputs:
        statistics:
          selector: '["statistics"]'
    packages:
    - pandas
  correlation_analysis:
    category: eda
    function_name: correlation_analysis
    source: eda/correlation_analysis.py
    signature: 'correlation_analysis(data: object, target_col: str=None, method: str=''pearson'', top_n:
      int=10, significance_level: float=0.05) -> dict[str, object]'
    docstring: |-
      공정 파라미터 간 상관관계 및 target과의 상관분석을 수행합니다.
      Args:
          data: pandas DataFrame (또는 dict 컬럼-배열 형식)
          target_col: 타겟 컬럼명 (불량 여부 등). None이면 파라미터 간 상관만 계산
          method: 상관계수 방법 ("pearson","spearman", "kendall")
          top_n: 상위 N개 상관관계 반환
          significance_level: 유의수준 (기본 0.05)
      Returns:
          {
              "correlation_matrix": dict - 상관행렬 (컬럼-배열 형식),
              "top_correlations": dict - 상위 상관관계 쌍 (컬럼-배열 형식),
              "significant_pairs": dict - 통계적으로 유의한 상관 쌍 (컬럼-배열 형식),
              "target_correlations": didct - target과의 상관관계 (컬럼-배열 형식, target_col 있을 때),
              "shape": list,
              "columns": list,
          }
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: false
        default: null
      target_col:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: null
      method:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: pearson
      top_n:
        type: int
        kind: positional_or_keyword
        has_default: true
        default: 10
      significance_level:
        type: float
        kind: positional_or_keyword
        has_default: true
        default: 0.05
    returns:
      type: dict[str, object]
      outputs:
        correlation_matrix:
          selector: '["correlation_matrix"]'
        top_correlations:
          selector: '["top_correlations"]'
        significant_pairs:
          selector: '["significant_pairs"]'
        target_correlations:
          selector: '["target_correlations"]'
        shape:
          selector: '["shape"]'
        columns:
          selector: '["columns"]'
    packages:
    - numpy
    - pandas
    - scipy
  detect_outliers:
    category: eda
    function_name: detect_outliers
    source: eda/detect_outliers.py
    signature: 'detect_outliers(data: object, method: str=''iqr'', columns: list=None) -> dict[str, object]'
    docstring: |-
      다양한 방법으로 이상치를 탐지합니다.
      Args:
          data: pandas DataFrame (또는 dict 컬럼-배열 형식)
          method: 탐지 방법 ("iqr", "zscore", "isolation_forest")
          columns: 탐지할 컬럼 (선택사항)
      Returns:
          {"outlier_indices": list, "outlier_report": dict}
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: false
        default: null
      method:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: iqr
      columns:
        type: list
        kind: positional_or_keyword
        has_default: true
        default: null
    returns:
      type: dict[str, object]
      outputs:
        outlier_indices:
          selector: '["outlier_indices"]'
        outlier_report:
          selector: '["outlier_report"]'
    packages:
    - numpy
    - pandas
    - scikit-learn
  histogram_eda:
    category: eda
    function_name: histogram_eda
    source: eda/histogram_eda.py
    signature: 'histogram_eda(data: object, columns: list=None, bins: int=30, output_dir: str=''artifacts/plots'',
      figsize: tuple | list=(8, 5), dpi: int=150) -> dict[str, object]'
    docstring: |-
      데이터프레임의 각 컬럼에 대해 히스토그램/카운트플롯을 생성합니다.
      Args:
          data: pandas DataFrame (또는 dict 컬럼-배열 형식)
          columns: 플롯을 생성할 컬럼 목록. None이면 모든 수치형/범주형 컬럼.
          bins: 히스토그램 bin 수 (수치형 컬럼에만 적용)
          output_dir: 히스토그램 이미지를 저장할 디렉터리 (예: artifacts/plots)
          figsize: 그래프 크기. 기본 (8, 5)
          dpi: 저장 이미지 해상도. 기본 150

      Returns:
          {"histogram_paths": list} - 생성된 히스토그램 이미지 파일 경로 리스트
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: false
        default: null
      columns:
        type: list
        kind: positional_or_keyword
        has_default: true
        default: null
      bins:
        type: int
        kind: positional_or_keyword
        has_default: true
        default: 30
      output_dir:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: artifacts/plots
      figsize:
        type: tuple | list
        kind: positional_or_keyword
        has_default: true
        default:
        - 8
        - 5
      dpi:
        type: int
        kind: positional_or_keyword
        has_default: true
        default: 150
    returns:
      type: dict[str, object]
      outputs:
        histogram_paths:
          selector: '["histogram_paths"]'
    packages:
    - matplotlib
    - pandas
    - seaborn
  plot_failure_distribution:
    category: eda
    function_name: plot_failure_distribution
    source: eda/plot_failure_distribution.py
    signature: 'plot_failure_distribution(data: object, target_column: str=None, positive_label: int=1,
      output_dir: str=''artifacts/plots'', figsize: tuple=(8, 6), dpi: int=150) -> dict[str, object]'
    docstring: |-
      불량/정상 클래스 분포를 시각화합니다.
      Args:
          data: pandas DataFrame 또는 dict 컬럼-배열 형식
          positive_label: 불량(양성) 값 (기본 1)
          output_dir: 플롯 이미지를 저장할 디렉터리 (예: artifacts/plots)
          figsize: 그래프 크기. 기본 (8, 6)
          dpi: 저장 이미지 해상도. 기본 150
      Returns:
          {"plot_path": str, "class_counts": dict, "class_ratio": dict}
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: false
        default: null
      target_column:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: null
      positive_label:
        type: int
        kind: positional_or_keyword
        has_default: true
        default: 1
      output_dir:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: artifacts/plots
      figsize:
        type: tuple
        kind: positional_or_keyword
        has_default: true
        default:
        - 8
        - 6
      dpi:
        type: int
        kind: positional_or_keyword
        has_default: true
        default: 150
    returns:
      type: dict[str, object]
      outputs:
        plot_path:
          selector: '["plot_path"]'
        class_counts:
          selector: '["class_counts"]'
        class_ratio:
          selector: '["class_ratio"]'
    packages:
    - matplotlib
    - numpy
    - pandas
  profile_data:
    category: eda
    function_name: profile_data
    source: eda/profile_data.py
    signature: 'profile_data(data: object) -> dict[str, object]'
    docstring: |-
      데이터셋의 기본 통계 및 품질을 분석합니다.
      Args:
          data: pandas DataFrame (또는 dict 컬럼-배열 형식)
      Returns:
          {"profile": dict} - row_count, missing_rate 등
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: false
        default: null
    returns:
      type: dict[str, object]
      outputs:
        profile:
          selector: '["profile"]'
    packages:
    - pandas
  target_correlation:
    category: eda
    function_name: target_correlation
    source: eda/target_correlation.py
    signature: 'target_correlation(data: object, target_column: str=None, method: str=''mutual_info'',
      positive_label: int=1, top_n: int=20, columns: list=None, output_dir: str=''artifacts/metrics'')
      -> dict[str, object]'
    docstring: |-
      target과 각 feature 간의 비선형 연관도를 계산합니다.
      (선형 상관은 correlation_analysis.py 사용)
      Args:
          data: pandas DataFrame 또는 dict 컬럼-배열 형식
          target_column: target 컬럼명
          method: 연관도 방법 ("mutual_info", "chi2", "anova")
          positive_label: 양성 값 (기본 1)
          top_n: 상위 N개 feature 반환
          columns: 분석할 feature 컬럼 리스트 (None이면 전체 수치형)
          output_dir: 통계 JSON을 저장할 디렉터리 (예: artifacts/metrics)
      Returns:
          {"scores": dict, "top_features": list, "ranked_features": list,
           "artifact_path": str}
    inputs:
      data:
        type: object
        kind: positional_or_keyword
        has_default: false
        default: null
      target_column:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: null
      method:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: mutual_info
      positive_label:
        type: int
        kind: positional_or_keyword
        has_default: true
        default: 1
      top_n:
        type: int
        kind: positional_or_keyword
        has_default: true
        default: 20
      columns:
        type: list
        kind: positional_or_keyword
        has_default: true
        default: null
      output_dir:
        type: str
        kind: positional_or_keyword
        has_default: true
        default: artifacts/metrics
    returns:
      type: dict[str, object]
      outputs:
        scores:
          selector: '["scores"]'
        top_features:
