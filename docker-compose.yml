services:
  executor:
    image: executor-service:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # The image holds config.yml plus only this environment's file, so
        # build and run with the same APP_ENV.
        APP_ENV: ${APP_ENV:-}
    # Settings default in code; .env (optional) overrides any of them, and
    # the container-specific values below override .env.
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-}
      # Local stack: header (default) trusts identity headers without a key;
      # api_key (EXECUTOR_AUTH_MODE=api_key) requires X-Api-Key as in stg/prd.
      # These callers mirror config.prd.yml; the keys are local-only, not secrets:
      #   pr-agentic-service: exe_local_agent_0123456789abcdef0123456789ab
      #   pr-batch:           exe_local_batch_0123456789abcdef0123456789ab
      #   ops (admin):        exe_local_ops_0123456789abcdef0123456789abcd
      AUTH_MODE: ${EXECUTOR_AUTH_MODE:-header}
      AUTH_CLIENTS: '[{"name": "pr-agentic-service", "key_sha256": ["e2b1bf2de62fb2800fdebf97b31fc0385f71ce630d68bab42a7a1aa4dd0e2b65"], "tenant": "dtest-agent-service", "relay": true, "allowed_tenants": ["*"]}, {"name": "pr-batch", "key_sha256": ["d0c047f993bf6eb1eeb6d026185b1d34a6062b76f080b4ae2eb65b73093386dc"], "relay": true, "allowed_tenants": ["*"]}, {"name": "ops", "key_sha256": ["364d317335897db4f6e2660edcf5f3efe36edaf5011abed7ee1c32c868651e85"], "admin": true}]'
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-executor}:${POSTGRES_PASSWORD:-executor}@postgres:5432/${POSTGRES_DB:-executor}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      DB_MIGRATIONS_PATH: /app/migrations
      REDIS_URL: redis://redis:6379/0
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS_DOCKER:-localhost:*,127.0.0.1:*,testserver,executor:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS_DOCKER:-http://localhost:*,http://127.0.0.1:*}
      LOG_CONFIG_FILE: /app/logger.yml
      SHARED_STORAGE_ROOT: /workspace/shared
      # Container path, not a host path. Mount the input directory if separate.
      INPUT_STORAGE_ROOT: ${INPUT_STORAGE_ROOT_DOCKER:-/workspace/shared}
    ports:
      - "${EXECUTOR_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - default
      - shared-infra
      - runtimes
    volumes:
      - ./shared_dir:/workspace/shared
    # Longer than drain plus cleanup, so a stop hands running Steps over instead of SIGKILL.
    stop_grace_period: 90s
    restart: unless-stopped

networks:
  shared-infra:
    external: true
    name: ${SHARED_INFRA_NETWORK:-shared-infra}
  runtimes:
    external: true
    name: ${RUNTIME_NETWORK:-executor-runtimes}
