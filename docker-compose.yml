services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-executor}
      POSTGRES_USER: ${POSTGRES_USER:-executor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-executor}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U executor -d executor"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - executor-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - executor-redis:/data

  migrate:
    image: executor-service:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-executor}:${POSTGRES_PASSWORD:-executor}@postgres:5432/${POSTGRES_DB:-executor}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  jupyter:
    image: executor-jupyter:local
    build:
      context: .
      dockerfile: test_harness/jupyter/Dockerfile
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-change-me-local-only}
      EXECUTOR_RESOURCE_CPU_CORES: ${JUPYTER_RESOURCE_CPU_CORES:-2}
      EXECUTOR_RESOURCE_MEMORY_BYTES: ${JUPYTER_RESOURCE_MEMORY_BYTES:-4294967296}
    ports:
      - "8888:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null && curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/executor/resource-status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./test_harness/jupyter/workspace:/workspace/pv

  executor:
    image: executor-service:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-local}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-executor}:${POSTGRES_PASSWORD:-executor}@postgres:5432/${POSTGRES_DB:-executor}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      REDIS_URL: redis://redis:6379/0
      REDIS_WORK_STREAM: ${REDIS_WORK_STREAM:-executor.work}
      REDIS_EVENT_STREAM: ${REDIS_EVENT_STREAM:-executor.events}
      REDIS_WORK_DEAD_LETTER_STREAM: ${REDIS_WORK_DEAD_LETTER_STREAM:-executor.work.dlq}
      REDIS_EVENT_DEAD_LETTER_STREAM: ${REDIS_EVENT_DEAD_LETTER_STREAM:-executor.events.dlq}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS_DOCKER:-localhost:*,127.0.0.1:*,testserver,executor:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS_DOCKER:-http://localhost:*,http://127.0.0.1:*}
      RUNTIME_ENABLED: "true"
      RUNTIME_TARGET_NAME: ${RUNTIME_TARGET_NAME:-local-jupyter}
      JUPYTER_ENDPOINT: http://jupyter:8888
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-change-me-local-only}
      JUPYTER_STORAGE_TIMEOUT_SECONDS: ${JUPYTER_STORAGE_TIMEOUT_SECONDS:-300}
      RUNTIME_CREDENTIAL_KEY: ${RUNTIME_CREDENTIAL_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      RUNTIME_POOL: INTERACTIVE
      RUNTIME_ALLOWED_PROFILES: ${RUNTIME_ALLOWED_PROFILES:-basic,ml}
      RUNTIME_DEFAULT_MAX_CONCURRENT_EXECUTIONS: ${RUNTIME_DEFAULT_MAX_CONCURRENT_EXECUTIONS:-2}
      RUNTIME_HEALTH_POLL_INTERVAL_SECONDS: ${RUNTIME_HEALTH_POLL_INTERVAL_SECONDS:-15}
      RUNTIME_RESOURCE_MAX_AGE_SECONDS: ${RUNTIME_RESOURCE_MAX_AGE_SECONDS:-45}
      RUNTIME_MEMORY_ADMISSION_LIMIT: ${RUNTIME_MEMORY_ADMISSION_LIMIT:-0.9}
      INPUT_HOST_ROOT: /workspace/input
      TRACING_ENABLED: ${TRACING_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://phoenix:6006/v1/traces}
    ports:
      - "${EXECUTOR_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      jupyter:
        condition: service_healthy
    volumes:
      - ./input_dir:/workspace/input:ro
    restart: unless-stopped

  jupyter-secondary:
    profiles: ["multi-jupyter"]
    image: executor-jupyter:local
    environment:
      JUPYTER_TOKEN: ${JUPYTER_SECONDARY_TOKEN:-change-me-secondary-local-only}
      EXECUTOR_RESOURCE_CPU_CORES: ${JUPYTER_RESOURCE_CPU_CORES:-2}
      EXECUTOR_RESOURCE_MEMORY_BYTES: ${JUPYTER_RESOURCE_MEMORY_BYTES:-4294967296}
    ports:
      - "8889:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null && curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/executor/resource-status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./test_harness/jupyter/workspace:/workspace/pv

  jupyter-batch-primary:
    profiles: ["batch-jupyter"]
    image: executor-jupyter:local
    environment:
      JUPYTER_TOKEN: ${JUPYTER_BATCH_PRIMARY_TOKEN:-change-me-batch-primary-local-only}
      EXECUTOR_RESOURCE_CPU_CORES: ${JUPYTER_RESOURCE_CPU_CORES:-2}
      EXECUTOR_RESOURCE_MEMORY_BYTES: ${JUPYTER_RESOURCE_MEMORY_BYTES:-4294967296}
    ports:
      - "8890:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null && curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/executor/resource-status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./test_harness/jupyter/workspace:/workspace/pv

  jupyter-batch-secondary:
    profiles: ["batch-jupyter"]
    image: executor-jupyter:local
    environment:
      JUPYTER_TOKEN: ${JUPYTER_BATCH_SECONDARY_TOKEN:-change-me-batch-secondary-local-only}
      EXECUTOR_RESOURCE_CPU_CORES: ${JUPYTER_RESOURCE_CPU_CORES:-2}
      EXECUTOR_RESOURCE_MEMORY_BYTES: ${JUPYTER_RESOURCE_MEMORY_BYTES:-4294967296}
    ports:
      - "8891:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null && curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/executor/resource-status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./test_harness/jupyter/workspace:/workspace/pv

  phoenix:
    profiles: ["observability"]
    image: arizephoenix/phoenix:nightly
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    ports:
      - "6006:6006"
      - "4317:4317"
      - "9090:9090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - executor-phoenix:/mnt/data

volumes:
  executor-postgres:
  executor-redis:
  executor-phoenix:
