services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: executor
      POSTGRES_USER: executor
      POSTGRES_PASSWORD: executor
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U executor -d executor"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - executor-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - executor-redis:/data

  jupyter:
    image: jupyter/datascience-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-change-me-local-only}
    ports:
      - "8888:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./notebook_dir:/workspace/pv
      - ./docker/jupyter_server_config.py:/home/jovyan/.jupyter/jupyter_server_config.py:ro

  jupyter-secondary:
    profiles: ["multi-jupyter"]
    image: jupyter/datascience-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_SECONDARY_TOKEN:-change-me-secondary-local-only}
    ports:
      - "8889:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./notebook_dir:/workspace/pv
      - ./docker/jupyter_server_config.py:/home/jovyan/.jupyter/jupyter_server_config.py:ro

  jupyter-batch-primary:
    profiles: ["batch-jupyter"]
    image: jupyter/datascience-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_BATCH_PRIMARY_TOKEN:-change-me-batch-primary-local-only}
    ports:
      - "8890:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./notebook_dir:/workspace/pv
      - ./docker/jupyter_server_config.py:/home/jovyan/.jupyter/jupyter_server_config.py:ro

  jupyter-batch-secondary:
    profiles: ["batch-jupyter"]
    image: jupyter/datascience-notebook:latest
    environment:
      JUPYTER_TOKEN: ${JUPYTER_BATCH_SECONDARY_TOKEN:-change-me-batch-secondary-local-only}
    ports:
      - "8891:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./notebook_dir:/workspace/pv
      - ./docker/jupyter_server_config.py:/home/jovyan/.jupyter/jupyter_server_config.py:ro

  phoenix:
    profiles: ["observability"]
    image: arizephoenix/phoenix:nightly
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    ports:
      - "6006:6006"
      - "4317:4317"
      - "9090:9090"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - executor-phoenix:/mnt/data

volumes:
  executor-postgres:
  executor-redis:
  executor-phoenix:
