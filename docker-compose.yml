services:
  executor:
    image: executor-service:local
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENV: ${APP_ENV:-}
      LOG_LEVEL: ${LOG_LEVEL:-}
      REST_ERROR_BODY_LOGGING_ENABLED: ${REST_ERROR_BODY_LOGGING_ENABLED:-false}
      REST_ERROR_BODY_LOG_MAX_BYTES: ${REST_ERROR_BODY_LOG_MAX_BYTES:-65536}
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-executor}:${POSTGRES_PASSWORD:-executor}@postgres:5432/${POSTGRES_DB:-executor}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-5}
      DATABASE_POOL_TIMEOUT_SECONDS: ${DATABASE_POOL_TIMEOUT_SECONDS:-30}
      DATABASE_POOL_RECYCLE_SECONDS: ${DATABASE_POOL_RECYCLE_SECONDS:-1800}
      DATABASE_CONNECT_TIMEOUT_SECONDS: ${DATABASE_CONNECT_TIMEOUT_SECONDS:-10}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      DB_MIGRATIONS_PATH: /app/migrations
      DB_MIGRATION_LOCK_TIMEOUT_SECONDS: ${DB_MIGRATION_LOCK_TIMEOUT_SECONDS:-60}
      DB_MIGRATION_STATEMENT_TIMEOUT_SECONDS: ${DB_MIGRATION_STATEMENT_TIMEOUT_SECONDS:-300}
      REDIS_URL: redis://redis:6379/0
      REDIS_CONNECT_TIMEOUT_SECONDS: ${REDIS_CONNECT_TIMEOUT_SECONDS:-5}
      REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-5}
      OUTBOX_PUBLISH_TIMEOUT_SECONDS: ${OUTBOX_PUBLISH_TIMEOUT_SECONDS:-5}
      OUTBOX_SHUTDOWN_TIMEOUT_SECONDS: ${OUTBOX_SHUTDOWN_TIMEOUT_SECONDS:-10}
      REDIS_EVENT_STREAM: ${REDIS_EVENT_STREAM:-executor.events}
      EVENT_RETENTION_ENABLED: ${EVENT_RETENTION_ENABLED:-true}
      EVENT_RETENTION_INTERVAL_SECONDS: ${EVENT_RETENTION_INTERVAL_SECONDS:-3600}
      EVENT_RETENTION_BATCH_SIZE: ${EVENT_RETENTION_BATCH_SIZE:-1000}
      REDIS_EVENT_RETENTION_SECONDS: ${REDIS_EVENT_RETENTION_SECONDS:-604800}
      PUBLISHED_OUTBOX_RETENTION_SECONDS: ${PUBLISHED_OUTBOX_RETENTION_SECONDS:-604800}
      EXECUTION_EVENT_RETENTION_SECONDS: ${EXECUTION_EVENT_RETENTION_SECONDS:-7776000}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS_DOCKER:-localhost:*,127.0.0.1:*,testserver,executor:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS_DOCKER:-http://localhost:*,http://127.0.0.1:*}
      RUNTIME_CREDENTIAL_KEY: ${RUNTIME_CREDENTIAL_KEY:-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}
      RUNTIME_SESSION_COUNT_MAX_AGE_SECONDS: ${RUNTIME_SESSION_COUNT_MAX_AGE_SECONDS:-45}
      RUNTIME_CLEANUP_RETRY_INTERVAL_SECONDS: ${RUNTIME_CLEANUP_RETRY_INTERVAL_SECONDS:-60}
      SHARED_STORAGE_ROOT: /workspace/shared
      # Container path, not a host path. Mount the input directory if separate.
      INPUT_STORAGE_ROOT: ${INPUT_STORAGE_ROOT_DOCKER:-/workspace/shared}
      JUPYTER_STREAM_RECONNECT_SECONDS: ${JUPYTER_STREAM_RECONNECT_SECONDS:-30}
      EXECUTION_DRAIN_TIMEOUT_SECONDS: ${EXECUTION_DRAIN_TIMEOUT_SECONDS:-30}
      EXECUTION_SHUTDOWN_CLEANUP_SECONDS: ${EXECUTION_SHUTDOWN_CLEANUP_SECONDS:-20}
      RUNTIME_ABORT_TIMEOUT_SECONDS: ${RUNTIME_ABORT_TIMEOUT_SECONDS:-15}
      RUNTIME_MAX_OUTPUT_MESSAGE_BYTES: ${RUNTIME_MAX_OUTPUT_MESSAGE_BYTES:-33554432}
      EXECUTION_MAX_STEPS_PER_OPERATION: ${EXECUTION_MAX_STEPS_PER_OPERATION:-100}
      EXECUTION_MAX_STEPS_PER_EXECUTION: ${EXECUTION_MAX_STEPS_PER_EXECUTION:-1000}
    ports:
      - "${EXECUTOR_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - default
      - shared-infra
      - runtimes
    volumes:
      - ./shared_dir:/workspace/shared
    # Longer than drain plus cleanup, so a stop hands running Steps over instead of SIGKILL.
    stop_grace_period: 90s
    restart: unless-stopped

networks:
  shared-infra:
    external: true
    name: ${SHARED_INFRA_NETWORK:-shared-infra}
  runtimes:
    external: true
    name: ${RUNTIME_NETWORK:-executor-runtimes}
