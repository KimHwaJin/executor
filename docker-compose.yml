services:
  executor:
    image: executor-service:local
    build:
      context: .
      dockerfile: Dockerfile
    # Settings default in code; .env (optional) overrides any of them, and
    # the container-specific values below override .env.
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: ${APP_ENV:-}
      HOST: 0.0.0.0
      PORT: 8000
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-executor}:${POSTGRES_PASSWORD:-executor}@postgres:5432/${POSTGRES_DB:-executor}
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-true}
      DB_MIGRATIONS_PATH: /app/migrations
      REDIS_URL: redis://redis:6379/0
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS_DOCKER:-localhost:*,127.0.0.1:*,testserver,executor:*}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS_DOCKER:-http://localhost:*,http://127.0.0.1:*}
      LOG_CONFIG_FILE: /app/logger.yml
      SHARED_STORAGE_ROOT: /workspace/shared
      # Container path, not a host path. Mount the input directory if separate.
      INPUT_STORAGE_ROOT: ${INPUT_STORAGE_ROOT_DOCKER:-/workspace/shared}
    ports:
      - "${EXECUTOR_PORT:-8000}:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - default
      - shared-infra
      - runtimes
    volumes:
      - ./shared_dir:/workspace/shared
    # Longer than drain plus cleanup, so a stop hands running Steps over instead of SIGKILL.
    stop_grace_period: 90s
    restart: unless-stopped

networks:
  shared-infra:
    external: true
    name: ${SHARED_INFRA_NETWORK:-shared-infra}
  runtimes:
    external: true
    name: ${RUNTIME_NETWORK:-executor-runtimes}
