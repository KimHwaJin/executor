                      search_text: '이름: NCE 데이터 조회 및 변환 (수정)

                        사용자 요청: NCE 데이터를 조회하고 분석할 수 있는 형태로 변환해줘.

                        Skill: data_load

                        Tool: extract_data, transform_data'
                    workflow_id: d3cebc56-cf67-4b56-a1e8-2398e90c68f7
                    current_revision: 2
                    recommend_yn: Y
                    created_by: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                    updated_by: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                    created_at: '2026-10-12T06:00:00Z'
                    updated_at: '2026-10-12T07:00:00Z'
                detail_revision.response:
                  value:
                    version:
                      version_id: 539d4171-77f9-436a-a314-5c8c0608b836
                      revision: 1
                      workflow: *id002
                      registration_type: USER
                      created_by: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                      project_id: 58a269da-fd6b-4921-bda0-47845cd2b491
                      session_id: null
                      task_id: null
                      created_at: '2026-10-12T06:00:00Z'
                      search_text: '이름: NCE 데이터 조회 및 변환

                        사용자 요청: NCE 데이터를 조회하고 분석할 수 있는 형태로 변환해줘.

                        Skill: data_load

                        Tool: extract_data, transform_data'
                    workflow_id: d3cebc56-cf67-4b56-a1e8-2398e90c68f7
