openapi: 3.1.0
info:
  title: Workflow Catalog API
  version: 1.1.0
  description: 'WorkflowCatalogService API 계약서. 공통 서비스·DB 모델·마이그레이션 ew_0006은 구현되어 있으며 HTTP 라우터·요청/응답 변환·오류 매핑은 연결 대상이다. 기존 파일 기반 WorkflowService는 사용하지 않는다.


    경로는 공통 API prefix를 제외한 상대 경로다. 배포 서버 및 /api/v1 등의 prefix는 API 연결 시 결정한다. 기존 /workflows 라우터와 새 라우터를 같은 prefix에
    동시에 등록하지 않도록 통합 시 조정한다.


    Workflow 1.0 구조를 포함한다. API 요청 workflow는 문서 전체이므로 request.workflow.workflow.name 구조다. 등록·수정 시 JSON 구조뿐 아니라 Skill/Tool
    등록·소속·인자 타입/필수값·출력 참조·조건 계약을 의미 검증한다. 실행 input 미확정은 등록 오류가 아니다.


    공통 인증·권한 검사와 401/403은 이번 계약에서 제외한다. created_by/updated_by/deleted_by는 요청 메타데이터이며 인증 증빙이 아니다. chatapp users/projects/sessions/tasks는
    UUID 논리 참조, DB FK 없음. cross-DB 존재 검증 방식은 구현 연계 사항이며 권한 검증을 암묵적으로 가정하지 않는다.


    세 도메인 테이블: workflow_catalog(대표/추천/삭제), workflow_version(불변 Workflow 1.0/출처/등록 유형), workflow_embeddings(버전별 검색
    텍스트/모델/벡터). registration_type USER/AGENT, JSON actor 작성 주체, created_by 요청 사용자를 구분한다. 최초 등록 추천 N, 내용 수정 시 기존
    추천 유지. 현재 버전만 추천하며 이전 버전 이력 보존.


    초기 embedding_model=bge-m3, embedding_dimension=1024. 벡터 타입은 차원 미지정 VECTOR, dimension은 실제 길이와 일치. 검색용 텍스트의 세부
    구성은 Workflow name/user_request/execution_mode와 Skill 설명·Tool docstring이며 text_recipe_version=1이다. 예시 문자열은 설명용이다. Qwen 모델 전환은 재임베딩 및 검색 설정 변경 필요.


    등록·수정은 선택 Idempotency-Key를 공통 서비스의 idempotency_key로 전달한다. 요청 사용자 UUID와 키가 같고 정규화된 요청 본문이 같으면 최초 성공 결과를 재전달한다.
    같은 사용자·키에 다른 본문·작업·대상이면 409 IDEMPOTENCY_KEY_CONFLICT. 키가 없으면 기존 처리이며 수정 재요청은 expected_revision 충돌 검사를 따른다.
    성공 결과는 workflow_catalog_requests에 영구 보관하며 자동 만료하지 않는다. 실패는 키를 소비하지 않는다. 동시 요청도 한 번만 저장한다.


    API 라우터와 에이전트는 WorkflowCatalogService의 같은 메서드를 호출한다. 에이전트의 HTTP 호출은 필수가 아니며 내부 호출에도 같은 검증/트랜잭션/수정 버전 검사 규칙을
    적용한다. 추천 후 생성 전환·즉시 실행 등 시나리오 정책은 별도다.


    업데이트 경쟁은 expected_revision 검사와 저장을 같은 트랜잭션에서 처리한다. 임베딩 호출 동안 DB 트랜잭션을 유지하지 않으며 저장 직전에 다시 검사한다. 추천 허용 변경이나 삭제와
    경쟁할 때도 포인터/플래그/삭제 상태를 잃지 않도록 카탈로그 행 단위 동시성 제어가 필요하다.

    '
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
- url: /
  description: 배포 시 실제 API base URL/prefix로 설정.
security: []
tags:
- name: Workflow catalog
  description: 새 WorkflowCatalogService 기반 DB 저장 및 검색 계약.
paths:
  /workflows:
    post:
      tags:
      - Workflow catalog
      operationId: registerWorkflow
      summary: 워크플로우 최초 등록
      description: 사람·에이전트 공통 등록. Workflow 문서 검증 및 검색용 텍스트 구성 → bge-m3 임베딩(1024차원) → 한 DB 트랜잭션으로 세 테이블 저장. revision/current_revision=1,
        recommend_yn=N. input 실행값은 받지 않음. created_by를 카탈로그 created_by/updated_by와 버전 created_by에 저장. compiled 1.3은
        저장하지 않음.
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              register.request:
                value:
                  workflow: &id002
                    workflow_version: '1.0'
                    workflow:
                      actor:
                        type: USER
                        id: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                      name: NCE 데이터 조회 및 변환
                      user_request: NCE 데이터를 조회하고 분석할 수 있는 형태로 변환해줘.
                      execution_mode: static
                      allow_immediate_execution: false
                      steps:
                      - skill: data_load
                        tools:
                        - tool: extract_data
                          execution: always
                          arguments:
                            data_type:
                              source: input
                            lot_cd:
                              source: input
                            process:
                              source: input
                            query_mode:
                              source: input
                            start_dt:
                              source: input
                            end_dt:
                              source: input
                            wafer_list:
                              source: input
                        - tool: transform_data
                          execution: always
                          arguments:
                            data_type:
                              source: input
                            data:
                              source: tool_output
                              step_index: 0
                              tool_index: 0
                              output: data
                            transform_op:
                              source: input
                  registration_type: USER
                  created_by: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                  project_id: 58a269da-fd6b-4921-bda0-47845cd2b491
                  session_id: null
                  task_id: null
              register_agent.request:
                value:
                  workflow:
                    workflow_version: '1.0'
                    workflow:
                      actor:
                        type: AGENT
                        id: workflow_generator
                      name: NCE 데이터 조회 및 변환
                      user_request: NCE 데이터를 조회하고 분석할 수 있는 형태로 변환해줘.
                      execution_mode: static
                      allow_immediate_execution: false
                      steps:
                      - skill: data_load
                        tools:
                        - tool: extract_data
                          execution: always
                          arguments:
                            data_type:
                              source: input
                            lot_cd:
                              source: input
                            process:
                              source: input
                            query_mode:
                              source: input
                            start_dt:
                              source: input
                            end_dt:
                              source: input
                            wafer_list:
                              source: input
                        - tool: transform_data
                          execution: always
                          arguments:
                            data_type:
                              source: input
                            data:
                              source: tool_output
                              step_index: 0
                              tool_index: 0
                              output: data
                            transform_op:
                              source: input
                  registration_type: AGENT
                  created_by: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                  project_id: 58a269da-fd6b-4921-bda0-47845cd2b491
                  session_id: 8f946013-9304-4f4d-9572-cfb62420df68
                  task_id: be8f3251-da81-46be-a56c-faa6739601de
      responses:
        '201':
          description: 등록 완료.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
              examples:
                register.response:
                  value:
                    workflow_id: d3cebc56-cf67-4b56-a1e8-2398e90c68f7
                    version_id: 539d4171-77f9-436a-a314-5c8c0608b836
                    revision: 1
                    registration_type: USER
                    recommend_yn: N
        '422':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/EmbeddingError'
        '504':
          $ref: '#/components/responses/Timeout'
    get:
      tags:
      - Workflow catalog
      operationId: listWorkflows
      summary: 현재 버전 기준 관리용 목록
      description: 논리 삭제 제외, 추천 Y/N 모두 조회 가능. 현재 버전당 한 건. 필터 AND, 동점은 workflow_id 오름차순. q는 임베딩 없는 문자열 검색이며 SQL 와일드카드가
        아니라 문자 그대로 취급. 사용자·프로젝트 권한 필터 없음. 페이지 초과는 빈 items와 실제 total_count. 목록에는 JSON 본문·search_text·벡터 없음.
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: 현재 버전 name/user_request의 대소문자 무시 부분 문자열 검색. 공백 제거 후 빈 문자열은 필터 없음.
      - name: recommend_yn
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RecommendYN'
        description: ''
      - name: execution_mode
        in: query
        required: false
        schema:
          type: string
          enum:
          - static
          - adaptive
        description: ''
      - name: registration_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/RegistrationType'
        description: ''
      - name: created_by
        in: query
        required: false
        schema:
          type: string
          format: uuid
          description: ''
        description: 카탈로그 최초 등록 사용자 필터.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          description: ''
          minimum: 1
          default: 1
        description: ''
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
          default: 20
        description: ''
      - name: sort_by
        in: query
        required: false
        schema:
          type: string
          enum:
          - created_at
          - updated_at
          - name
          default: updated_at
        description: ''
      - name: sort_order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
        description: ''
      responses:
        '200':
          description: 목록 반환.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
              examples:
                list.response:
                  value:
                    items:
                    - workflow_id: d3cebc56-cf67-4b56-a1e8-2398e90c68f7
                      current_revision: 2
                      recommend_yn: Y
                      created_by: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                      updated_by: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                      created_at: '2026-10-12T06:00:00Z'
                      updated_at: '2026-10-12T07:00:00Z'
                      version_id: 7417c468-3e69-4415-aa22-c6788d72367b
                      name: NCE 데이터 조회 및 변환 (수정)
                      user_request: NCE 데이터를 조회하고 분석할 수 있는 형태로 변환해줘.
                      execution_mode: static
                      allow_immediate_execution: false
                      registration_type: USER
                    page: 1
                    page_size: 20
                    total_count: 1
                list_empty.response:
                  value:
                    items: []
                    page: 1
                    page_size: 20
                    total_count: 0
        '422':
          $ref: '#/components/responses/SearchValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /workflows/search:
    post:
      tags:
      - Workflow catalog
      operationId: searchWorkflows
      summary: 추천용 의미 기반 검색
      description: 미삭제 AND recommend_yn=Y AND current_revision AND 동일 모델·차원 임베딩만 검색. 초기 bge-m3/1024. similarity=1-cosine_distance,
        점수는 확률 아님. threshold 이상 필터 후 similarity 내림차순 및 workflow_id 오름차순으로 limit개. 결과 부족 시 기준 완화하지 않음. API 실패를 빈
        결과로 대체하지 않음. 프로젝트는 출처라 검색 제한에 사용하지 않음. 페이지네이션·전체 건수 없음. 생성 전환·사용자 거절·즉시 실행은 에이전트 정책으로 별도.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SearchRequest'
            examples:
              search.request:
                value:
                  query: NCE 데이터를 조회하고 변환해줘
                  limit: 3
                  threshold: 0.7
                  execution_mode: static
      responses:
        '200':
          description: 검색 결과 또는 빈 목록. 예시 similarity는 설명용이며 실측값 아님.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
              examples:
                search.response:
                  value:
                    items:
                    - workflow_id: d3cebc56-cf67-4b56-a1e8-2398e90c68f7
                      version_id: 7417c468-3e69-4415-aa22-c6788d72367b
                      revision: 2
                      similarity: 0.84
                      search_text: '이름: NCE 데이터 조회 및 변환 (수정)

                        사용자 요청: NCE 데이터를 조회하고 분석할 수 있는 형태로 변환해줘.

                        Skill: data_load

                        Tool: extract_data, transform_data'
                      workflow: &id001
                        workflow_version: '1.0'
                        workflow:
                          actor:
                            type: USER
                            id: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                          name: NCE 데이터 조회 및 변환 (수정)
                          user_request: NCE 데이터를 조회하고 분석할 수 있는 형태로 변환해줘.
                          execution_mode: static
                          allow_immediate_execution: false
                          steps:
                          - skill: data_load
                            tools:
                            - tool: extract_data
                              execution: always
                              arguments:
                                data_type:
                                  source: input
                                lot_cd:
                                  source: input
                                process:
                                  source: input
                                query_mode:
                                  source: input
                                start_dt:
                                  source: input
                                end_dt:
                                  source: input
                                wafer_list:
                                  source: input
                            - tool: transform_data
                              execution: always
                              arguments:
                                data_type:
                                  source: input
                                data:
                                  source: tool_output
                                  step_index: 0
                                  tool_index: 0
                                  output: data
                                transform_op:
                                  source: literal
                                  value: pivot
                    returned_count: 1
                    limit: 3
                    threshold: 0.7
                    embedding_model: bge-m3
                search_empty.response:
                  value:
                    items: []
                    returned_count: 0
                    limit: 3
                    threshold: 0.7
                    embedding_model: bge-m3
        '422':
          $ref: '#/components/responses/SearchValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/EmbeddingError'
        '504':
          $ref: '#/components/responses/Timeout'
  /workflows/{workflow_id}:
    parameters:
    - &id003
      name: workflow_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
        description: ''
      description: 워크플로우 식별자.
    get:
      tags:
      - Workflow catalog
      operationId: getWorkflow
      summary: 현재 또는 지정 버전 상세 조회
      description: revision 생략 시 current_revision 조회. version.workflow는 문서 전체. 최상위 등록자·시각·recommend_yn은 현재 카탈로그
        정보, version 내부는 조회 버전 정보. 과거 버전 조회에서 recommend_yn=Y라도 과거 버전이 추천 대상은 아님. search_text는 현재 검색 모델의 해당 버전 텍스트이며
        없으면 null. 임베딩 벡터 제외.
      parameters:
      - name: revision
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Revision'
        description: ''
      responses:
        '200':
          description: 상세 조회 완료.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetailResponse'
              examples:
                detail_current.response:
                  value:
                    version:
                      version_id: 7417c468-3e69-4415-aa22-c6788d72367b
                      revision: 2
                      workflow: *id001
                      registration_type: USER
                      created_by: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                      project_id: 58a269da-fd6b-4921-bda0-47845cd2b491
                      session_id: null
                      task_id: null
