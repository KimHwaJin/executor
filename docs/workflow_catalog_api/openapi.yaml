          $ref: '#/components/responses/DetailNotFound'
    put:
      tags:
      - Workflow catalog
      operationId: updateWorkflow
      summary: 내용 수정 및 새 버전 생성
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      description: Workflow 1.0 전체 교체. expected_revision 불일치 409. 검증·임베딩 생성 후 트랜잭션에서 다시 비교하고 current_revision+1
        저장 및 포인터 갱신. concurrent update/delete와 원자적으로 처리. 새 버전 created_by=요청 updated_by. 최초 등록자·시각과 recommend_yn
        유지; 추천 변경과 동시 처리 시 최신 값을 덮어쓰지 않음. 선택 출처는 생략/null 시 NULL(이전값 상속 없음). 실패 시 버전·임베딩·포인터 모두 미반영.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRequest'
            examples:
              update.request:
                value:
                  workflow: *id001
                  expected_revision: 1
                  updated_by: e4c7918e-a6f3-49ac-826b-ef456c11ae55
                  registration_type: USER
                  project_id: 58a269da-fd6b-4921-bda0-47845cd2b491
                  session_id: null
                  task_id: null
      responses:
        '200':
          description: 수정 완료. recommend_yn은 수정 직전 카탈로그 값을 유지.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WriteResponse'
              examples:
                update.response:
                  value:
                    workflow_id: d3cebc56-cf67-4b56-a1e8-2398e90c68f7
                    version_id: 7417c468-3e69-4415-aa22-c6788d72367b
                    revision: 2
                    registration_type: USER
                    recommend_yn: Y
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '502':
          $ref: '#/components/responses/EmbeddingError'
        '504':
          $ref: '#/components/responses/Timeout'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/UpdateConflict'
    delete:
      tags:
      - Workflow catalog
      operationId: deleteWorkflow
      summary: 논리 삭제
      description: 본문 없음. 최초 삭제 시 deleted_at/deleted_by/updated_at/updated_by 갱신, 버전·임베딩·실행 이력 보존. 이미 삭제됨은 최초 삭제
        정보를 유지하고 204. 존재하지 않는 ID만 404. 삭제 후 목록·상세·검색 제외.
      parameters:
      - name: deleted_by
        in: query
        required: true
        schema:
          type: string
          format: uuid
          description: ''
        description: 삭제 요청 사용자 UUID.
      responses:
        '204':
          description: 삭제 완료 또는 이미 삭제됨. 응답 본문 없음.
        '422':
          $ref: '#/components/responses/SearchValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
  /workflows/{workflow_id}/recommendation:
    parameters:
    - *id003
    patch:
      tags:
      - Workflow catalog
      operationId: updateWorkflowRecommendation
      summary: 추천 허용 여부 변경
      description: 관리 용도이나 현재 인증·권한 검사 미구현 범위. 요청 updated_by 사용. recommend_yn/updated_by/updated_at만 변경. 같은 값은 시각·사용자도
        변경하지 않고 성공. 새 버전·임베딩 없음. 삭제 대상 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecommendationRequest'
            examples:
              recommendation.request:
                value:
                  recommend_yn: Y
                  updated_by: e4c7918e-a6f3-49ac-826b-ef456c11ae55
      responses:
        '200':
          description: 변경 완료 또는 기존 값과 동일.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecommendationResponse'
              examples:
                recommendation.response:
                  value:
                    workflow_id: d3cebc56-cf67-4b56-a1e8-2398e90c68f7
                    current_revision: 2
                    recommend_yn: Y
        '422':
          $ref: '#/components/responses/SearchValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 등록·수정 재요청 식별자. 같은 요청의 재시도에는 같은 키와 본문을 사용하고 다른 요청에는 새 키를 사용한다. created_by/updated_by UUID와 함께 범위를 정하며 사용자별로 등록·수정이 같은 키 공간을 공유한다. 앞뒤 공백·빈 값은 422. 자동 만료하지 않는다.
      schema:
        type: string
        minLength: 1
        maxLength: 255
      example: 706e6903-628b-4b44-bb7e-68612725dd1c
  schemas:
    WorkflowDocument:
      $schema: https://json-schema.org/draft/2020-12/schema
      title: Workflow 1.0
      description: Workflow 1.0 문서 전체. API workflow 필드 안에 workflow_version 및 workflow를 모두 넣는다. 실행용 1.3 및 실행별 입력값은
        포함하지 않는다.
      $comment: 구조 및 실행 모드를 검증한다. Skill/Tool 등록 여부, 파라미터 타입·필수값, 출력 참조의 존재·선행 여부, 조건 규칙은 별도 의미 검증이 필요하다. default는
        주석이며 검증기가 값을 자동 삽입하지 않는다.
      type: object
      properties:
        workflow_version:
          const: '1.0'
        workflow:
          $ref: '#/components/schemas/WorkflowDocument/$defs/workflow'
      required:
      - workflow_version
      - workflow
      additionalProperties: false
      $defs:
        workflow:
          type: object
          properties:
            actor:
              $ref: '#/components/schemas/WorkflowDocument/$defs/actor'
            name:
              type: string
              minLength: 1
            user_request:
              type: string
              minLength: 1
            execution_mode:
              enum:
              - static
              - adaptive
            allow_immediate_execution:
              type: boolean
            steps:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/WorkflowDocument/$defs/step'
          required:
          - actor
          - name
          - user_request
          - execution_mode
          - allow_immediate_execution
          - steps
          additionalProperties: false
          allOf:
          - if:
              properties:
                execution_mode:
                  const: static
              required:
              - execution_mode
            then:
              properties:
                steps:
                  items:
                    properties:
                      tools:
                        items:
                          properties:
                            execution:
                              const: always
            else:
              properties:
                steps:
                  contains:
                    properties:
                      tools:
                        contains:
                          properties:
                            execution:
                              const: conditional
                          required:
                          - execution
                    required:
                    - tools
        actor:
          type: object
          properties:
            type:
              enum:
              - USER
              - AGENT
            id:
              type: string
              minLength: 1
          required:
          - type
          - id
          additionalProperties: false
        step:
          type: object
          properties:
            skill:
              type: string
              minLength: 1
            tools:
              type: array
              minItems: 1
              items:
                $ref: '#/components/schemas/WorkflowDocument/$defs/tool'
          required:
          - skill
          - tools
          additionalProperties: false
        tool:
          type: object
          properties:
            tool:
              type: string
              minLength: 1
            execution:
              enum:
              - always
              - conditional
            arguments:
              type: object
              default: {}
              propertyNames:
                type: string
                minLength: 1
              additionalProperties:
                $ref: '#/components/schemas/WorkflowDocument/$defs/argument'
          required:
          - tool
          - execution
          additionalProperties: false
        argument:
          oneOf:
          - $ref: '#/components/schemas/WorkflowDocument/$defs/literalArgument'
          - $ref: '#/components/schemas/WorkflowDocument/$defs/inputArgument'
          - $ref: '#/components/schemas/WorkflowDocument/$defs/toolOutputArgument'
        literalArgument:
          type: object
          properties:
            source:
              const: literal
            value:
              description: Tool 파라미터 타입에 맞는 JSON 값. null도 명시적 값이다.
          required:
          - source
          - value
          additionalProperties: false
        inputArgument:
          type: object
          properties:
            source:
              const: input
          required:
          - source
          additionalProperties: false
        toolOutputArgument:
          type: object
          properties:
            source:
              const: tool_output
            step_index:
              type: integer
              minimum: 0
              description: steps 배열의 0-based 위치
            tool_index:
              type: integer
              minimum: 0
              description: 해당 Step의 tools 배열의 0-based 위치
            output:
              type: string
              minLength: 1
          required:
          - source
          - step_index
          - tool_index
          - output
          additionalProperties: false
    RegistrationType:
      type: string
      description: 해당 버전의 등록 주체 유형. JSON actor는 작성 주체로 별도 관리.
      enum:
      - USER
      - AGENT
    RecommendYN:
      type: string
      description: 카탈로그 단위 추천 허용 여부. 현재 버전에만 적용.
      enum:
      - Y
      - N
    Timestamp:
      type: string
      description: UTC ISO 8601 시각.
      format: date-time
    Revision:
      type: integer
      description: 내용 버전. Workflow JSON 규격 버전 1.0과 구분.
      minimum: 1
    RegisterRequest:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowDocument'
        registration_type:
          $ref: '#/components/schemas/RegistrationType'
        created_by:
          type: string
          format: uuid
          description: 등록 요청 사용자 UUID. 에이전트 등록도 요청 사용자 값을 전달.
        project_id: &id004
          type:
          - string
          - 'null'
          format: uuid
          description: chatapp DB 논리 참조. FK 없음. 생략 또는 null이면 이번 버전에 NULL 저장.
        session_id: &id005
          type:
          - string
          - 'null'
          format: uuid
          description: chatapp DB 논리 참조. FK 없음. 생략 또는 null이면 이번 버전에 NULL 저장.
        task_id: &id006
          type:
          - string
          - 'null'
          format: uuid
          description: chatapp DB 논리 참조. FK 없음. 생략 또는 null이면 이번 버전에 NULL 저장.
      required:
      - workflow
      - registration_type
      - created_by
      additionalProperties: false
    UpdateRequest:
      type: object
      properties:
        workflow:
          $ref: '#/components/schemas/WorkflowDocument'
        expected_revision:
          $ref: '#/components/schemas/Revision'
        updated_by:
          type: string
          format: uuid
          description: 수정 요청 사용자. 새 버전 created_by 및 카탈로그 updated_by에 저장.
        registration_type:
          $ref: '#/components/schemas/RegistrationType'
        project_id: *id004
        session_id: *id005
        task_id: *id006
      required:
      - workflow
      - expected_revision
      - updated_by
      - registration_type
      additionalProperties: false
    WriteResponse:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
          description: ''
        version_id:
          type: string
          format: uuid
          description: ''
        revision:
          $ref: '#/components/schemas/Revision'
        registration_type:
          $ref: '#/components/schemas/RegistrationType'
        recommend_yn:
          $ref: '#/components/schemas/RecommendYN'
      required:
      - workflow_id
      - version_id
      - revision
      - registration_type
      - recommend_yn
      additionalProperties: false
    RecommendationRequest:
      type: object
      properties:
        recommend_yn:
          $ref: '#/components/schemas/RecommendYN'
        updated_by:
          type: string
          format: uuid
          description: 요청으로 전달받는 변경 사용자 UUID. 인증을 의미하지 않음.
      required:
      - recommend_yn
      - updated_by
      additionalProperties: false
    RecommendationResponse:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
          description: ''
        current_revision:
          $ref: '#/components/schemas/Revision'
        recommend_yn:
          $ref: '#/components/schemas/RecommendYN'
      required:
      - workflow_id
      - current_revision
      - recommend_yn
      additionalProperties: false
    SearchRequest:
      type: object
      properties:
        query:
          type: string
          description: 검색할 사용자 질문. 앞뒤 공백 제거 후 비어 있으면 422.
          minLength: 1
          pattern: \S
        limit:
          type: integer
          description: 최대 결과 수.
          minimum: 1
          maximum: 20
          default: 3
        threshold:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
          default: null
          description: 최소 코사인 유사도. null/생략은 하한 없음. 확률이 아님.
        execution_mode:
          type:
          - string
          - 'null'
          enum:
          - static
          - adaptive
          - null
          default: null
          description: null/생략은 전체 실행 모드.
      required:
      - query
      additionalProperties: false
    SearchItem:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
          description: ''
        version_id:
          type: string
          format: uuid
          description: ''
        revision:
          $ref: '#/components/schemas/Revision'
        similarity:
          type: number
          minimum: -1
          maximum: 1
        search_text:
          type: string
          description: 검색에 사용된 해당 버전·모델의 실제 임베딩 입력 텍스트.
        workflow:
          $ref: '#/components/schemas/WorkflowDocument'
      required:
      - workflow_id
      - version_id
      - revision
      - similarity
      - search_text
      - workflow
      additionalProperties: false
    SearchResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchItem'
          maxItems: 20
        returned_count:
          type: integer
          description: ''
          minimum: 0
          maximum: 20
        limit:
          type: integer
          description: ''
          minimum: 1
          maximum: 20
        threshold:
          type:
          - number
          - 'null'
          minimum: -1
          maximum: 1
        embedding_model:
          type: string
          description: 초기 모델 bge-m3. 질문과 저장 벡터에 동일 모델·차원 사용.
      required:
      - items
      - returned_count
      - limit
      - threshold
      - embedding_model
      additionalProperties: false
    ListItem:
      type: object
      properties:
        workflow_id: &id007
          type: string
          format: uuid
          description: ''
        current_revision: &id008
          $ref: '#/components/schemas/Revision'
        recommend_yn: &id009
          $ref: '#/components/schemas/RecommendYN'
        created_by: &id010
          type: string
          format: uuid
          description: 카탈로그 최초 등록 사용자.
        updated_by: &id011
          type: string
          format: uuid
          description: 카탈로그 마지막 변경 사용자.
        created_at: &id012
          $ref: '#/components/schemas/Timestamp'
        updated_at: &id013
          $ref: '#/components/schemas/Timestamp'
        version_id:
          type: string
          format: uuid
          description: ''
        name:
          type: string
        user_request:
          type: string
        execution_mode:
          type: string
          enum:
          - static
          - adaptive
        allow_immediate_execution:
          type: boolean
        registration_type:
          $ref: '#/components/schemas/RegistrationType'
      required:
      - workflow_id
      - current_revision
      - recommend_yn
      - created_by
      - updated_by
      - created_at
      - updated_at
      - version_id
      - name
      - user_request
      - execution_mode
      - allow_immediate_execution
      - registration_type
      additionalProperties: false
    ListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ListItem'
          maxItems: 100
        page:
          type: integer
          description: ''
          minimum: 1
        page_size:
          type: integer
          description: ''
          minimum: 1
          maximum: 100
        total_count:
          type: integer
          description: 필터에 맞는 전체 워크플로우 수. 페이지 범위를 넘어도 실제 전체 수 반환.
          minimum: 0
      required:
      - items
      - page
      - page_size
      - total_count
      additionalProperties: false
    VersionDetail:
      type: object
      properties:
        version_id:
          type: string
          format: uuid
          description: ''
        revision:
          $ref: '#/components/schemas/Revision'
        workflow:
          $ref: '#/components/schemas/WorkflowDocument'
        registration_type:
          $ref: '#/components/schemas/RegistrationType'
        created_by:
          type: string
          format: uuid
          description: 해당 버전 등록 요청 사용자.
        project_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 생성 출처. chatapp DB 논리 참조.
        session_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 생성 출처. chatapp DB 논리 참조.
        task_id:
          type:
          - string
          - 'null'
          format: uuid
          description: 생성 출처. chatapp DB 논리 참조.
        created_at:
          $ref: '#/components/schemas/Timestamp'
        search_text:
          type:
          - string
          - 'null'
          description: 해당 버전의 현재 검색 모델(bge-m3) 텍스트. 없으면 null.
      required:
      - version_id
      - revision
      - workflow
      - registration_type
      - created_by
      - project_id
      - session_id
      - task_id
      - created_at
      - search_text
      additionalProperties: false
    DetailResponse:
      type: object
      properties:
        workflow_id: *id007
        current_revision: *id008
        recommend_yn: *id009
        created_by: *id010
        updated_by: *id011
        created_at: *id012
        updated_at: *id013
        version:
          $ref: '#/components/schemas/VersionDetail'
      required:
      - workflow_id
      - current_revision
      - recommend_yn
      - created_by
      - updated_by
      - created_at
      - updated_at
      - version
      additionalProperties: false
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
              - REQUEST_VALIDATION_ERROR
              - WORKFLOW_VALIDATION_ERROR
              - WORKFLOW_NOT_FOUND
              - WORKFLOW_VERSION_NOT_FOUND
              - WORKFLOW_REVISION_CONFLICT
              - IDEMPOTENCY_KEY_CONFLICT
              - EMBEDDING_SERVICE_ERROR
              - EMBEDDING_TIMEOUT
              - INTERNAL_ERROR
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type:
                    - string
                    - 'null'
                    description: 요청 필드 경로 또는 null.
                  reason:
                    type: string
                  expected_revision:
                    $ref: '#/components/schemas/Revision'
                  current_revision:
                    $ref: '#/components/schemas/Revision'
                required:
                - field
                - reason
                additionalProperties: true
              description: 추가 정보가 없으면 빈 배열.
          required:
          - code
          - message
          - details
          additionalProperties: false
      required:
      - error
      additionalProperties: false
  responses:
    IdempotencyConflict:
      description: 같은 요청 사용자·Idempotency-Key를 다른 본문·작업·대상에 재사용함. 기존 요청은 변경하지 않는다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            error_idempotency_conflict:
              value:
                error:
                  code: IDEMPOTENCY_KEY_CONFLICT
                  message: 같은 요청 키가 다른 요청에 사용되었습니다. 새 요청에는 새 키를 사용해주세요.
                  details: []
    ValidationError:
      description: 요청값·형식 또는 Workflow 구조·의미 검증 실패.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            error_request_validation:
              value: &id014
                error:
                  code: REQUEST_VALIDATION_ERROR
                  message: 요청값이 올바르지 않습니다.
                  details:
                  - field: limit
                    reason: 1 이상 20 이하의 정수여야 합니다.
            error_workflow_validation:
              value:
                error:
