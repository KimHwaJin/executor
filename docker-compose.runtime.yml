name: executor-runtimes

services:
  # INTERACTIVE primary; registered in Executor as local-jupyter.
  jupyter:
    image: executor-jupyter:local
    # Same image as production; needs deploy/jupyter/python-sources (README).
    build:
      context: deploy/jupyter
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-default}
      JUPYTER_ROOT_DIR: /workspace/pv
      EXECUTOR_RESOURCE_CPU_CORES: ${JUPYTER_RESOURCE_CPU_CORES:-2}
      EXECUTOR_RESOURCE_MEMORY_BYTES: ${JUPYTER_RESOURCE_MEMORY_BYTES:-4294967296}
    ports:
      - "8888:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null && curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/executor/resource-status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./test_harness/jupyter/workspace:/workspace/pv

  # INTERACTIVE secondary; registered as local-jupyter-secondary.
  jupyter-secondary:
    image: executor-jupyter:local
    environment:
      JUPYTER_TOKEN: ${JUPYTER_SECONDARY_TOKEN:-default}
      JUPYTER_ROOT_DIR: /workspace/pv
      EXECUTOR_RESOURCE_CPU_CORES: ${JUPYTER_RESOURCE_CPU_CORES:-2}
      EXECUTOR_RESOURCE_MEMORY_BYTES: ${JUPYTER_RESOURCE_MEMORY_BYTES:-4294967296}
    ports:
      - "8889:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null && curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/executor/resource-status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./test_harness/jupyter/workspace:/workspace/pv

  # BATCH primary; registered as local-jupyter-batch-primary.
  jupyter-batch-primary:
    image: executor-jupyter:local
    environment:
      JUPYTER_TOKEN: ${JUPYTER_BATCH_PRIMARY_TOKEN:-default}
      JUPYTER_ROOT_DIR: /workspace/pv
      EXECUTOR_RESOURCE_CPU_CORES: ${JUPYTER_RESOURCE_CPU_CORES:-2}
      EXECUTOR_RESOURCE_MEMORY_BYTES: ${JUPYTER_RESOURCE_MEMORY_BYTES:-4294967296}
    ports:
      - "8890:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null && curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/executor/resource-status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./test_harness/jupyter/workspace:/workspace/pv

  # BATCH secondary; registered as local-jupyter-batch-secondary.
  jupyter-batch-secondary:
    image: executor-jupyter:local
    environment:
      JUPYTER_TOKEN: ${JUPYTER_BATCH_SECONDARY_TOKEN:-default}
      JUPYTER_ROOT_DIR: /workspace/pv
      EXECUTOR_RESOURCE_CPU_CORES: ${JUPYTER_RESOURCE_CPU_CORES:-2}
      EXECUTOR_RESOURCE_MEMORY_BYTES: ${JUPYTER_RESOURCE_MEMORY_BYTES:-4294967296}
    ports:
      - "8891:8888"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/api/status" >/dev/null && curl --fail --silent --header "Authorization: token $${JUPYTER_TOKEN}" "http://127.0.0.1:8888/executor/resource-status" >/dev/null',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    volumes:
      - ./test_harness/jupyter/workspace:/workspace/pv

networks:
  default:
    name: ${RUNTIME_NETWORK:-executor-runtimes}
