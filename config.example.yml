# Copy to config.dev.yml, config.stg.yml or config.prd.yml and set
# APP_ENV=dev|stg|prd (local reads no file). Keys are Settings field names
# in any case; an environment variable with the same name still overrides.
# Unmasked bodies: opt in only after approving log access/retention.
REST_ERROR_BODY_LOGGING_ENABLED: false
REST_ERROR_BODY_LOG_MAX_BYTES: 65536
HOST: 0.0.0.0
PORT: 8000
DATABASE_POOL_SIZE: 10
DATABASE_MAX_OVERFLOW: 5
DATABASE_POOL_TIMEOUT_SECONDS: 30
DATABASE_POOL_RECYCLE_SECONDS: 1800
DATABASE_CONNECT_TIMEOUT_SECONDS: 10
REDIS_WORK_STREAM: executor.work
REDIS_CONNECT_TIMEOUT_SECONDS: 5
REDIS_SOCKET_TIMEOUT_SECONDS: 5
OUTBOX_PUBLISH_TIMEOUT_SECONDS: 5
OUTBOX_SHUTDOWN_TIMEOUT_SECONDS: 10
REDIS_EVENT_STREAM: executor.events
REDIS_WORK_DEAD_LETTER_STREAM: executor.work.dlq
REDIS_EVENT_DEAD_LETTER_STREAM: executor.events.dlq
OUTBOX_POLL_INTERVAL_SECONDS: 0.5
OUTBOX_BATCH_SIZE: 100
EVENT_RETENTION_ENABLED: true
EVENT_RETENTION_INTERVAL_SECONDS: 3600
EVENT_RETENTION_LEASE_SECONDS: 300
EVENT_RETENTION_BATCH_SIZE: 1000
REDIS_WORK_RETENTION_SECONDS: 259200
REDIS_EVENT_RETENTION_SECONDS: 604800
REDIS_WORK_DLQ_RETENTION_SECONDS: 2592000
PUBLISHED_OUTBOX_RETENTION_SECONDS: 604800
EXECUTION_EVENT_RETENTION_SECONDS: 7776000
MCP_ALLOWED_HOSTS:
  - "executor:*"
  - "executor.example.internal:*"
MCP_ALLOWED_ORIGINS:
  - "https://agent.example.internal"
# Project root layout: <root>/executor holds results; callers send
# inputs relative to <root> (batch/inputs/..., agent/...).
SHARED_STORAGE_ROOT: /mnt/data/dtest/executor
INPUT_STORAGE_ROOT: /mnt/data/dtest
RUNTIME_ENABLED: true
# Requires Jupyter's /executor/kernels/{id}/executions endpoints.
JUPYTER_STREAM_RECONNECT_SECONDS: 30
RUNTIME_ALLOWED_PROFILES:
  - "default"
  - "3102311"
RUNTIME_DEFAULT_MAX_CONCURRENT_EXECUTIONS: 2
RUNTIME_HEALTH_POLL_INTERVAL_SECONDS: 15
RUNTIME_SESSION_COUNT_MAX_AGE_SECONDS: 45
RUNTIME_RESOURCE_MAX_AGE_SECONDS: 45
RUNTIME_MEMORY_ADMISSION_LIMIT: 0.9
RUNTIME_CLEANUP_RETRY_INTERVAL_SECONDS: 60
EXECUTION_INLINE_SPEC_MAX_BYTES: 262144
EXECUTION_FILE_SPEC_MAX_BYTES: 52428800
EXECUTION_MAX_STEPS_PER_OPERATION: 100
EXECUTION_MAX_STEPS_PER_EXECUTION: 1000
EXECUTION_CONSUMER_GROUP: executor-workers
EXECUTION_PENDING_CLAIM_INTERVAL_SECONDS: 5
EXECUTION_PENDING_CLAIM_IDLE_MILLISECONDS: 30000
EXECUTION_PENDING_CLAIM_BATCH_SIZE: 100
EXECUTION_LEASE_SECONDS: 60
EXECUTION_HEARTBEAT_SECONDS: 15
EXECUTION_DRAIN_TIMEOUT_SECONDS: 30
EXECUTION_SHUTDOWN_CLEANUP_SECONDS: 20
RUNTIME_ABORT_TIMEOUT_SECONDS: 15
RUNTIME_MAX_OUTPUT_MESSAGE_BYTES: 33554432
FAILED_SESSION_RETENTION_SECONDS: 3600
EXECUTION_MAX_RUNTIME_SECONDS: 432000
DB_AUTO_MIGRATE: true
DB_MIGRATIONS_PATH: /app/migrations
DB_MIGRATION_LOCK_TIMEOUT_SECONDS: 60
DB_MIGRATION_STATEMENT_TIMEOUT_SECONDS: 300
# Credentials live in this file: the platform has no Secrets.
DATABASE_URL: "postgresql+psycopg://REPLACE_USER:REPLACE_PASSWORD@postgresql.infra.svc.cluster.local:5432/executor"
REDIS_URL: "redis://:REPLACE_PASSWORD@redis-master.infra.svc.cluster.local:6379/3"
RUNTIME_CREDENTIAL_KEY: REPLACE_WITH_FERNET_KEY
