[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dtest-agent"
version = "0.1.0"
description = "LangGraph-based data analysis workflow agent"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiohttp>=3.10,<4.0",
    "alembic>=1.13,<2.0",
    "asyncpg>=0.29,<1.0",
    "arize-phoenix-otel==0.17.1",
    "cryptography>=43.0,<51.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28,<1.0",
    "jsonschema>=4.23,<5.0",
    "langchain==1.3.17",
    "langchain-openai==1.6.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-postgres==3.1.2",
    "langgraph-cli[inmem]==0.4.31",
    "matplotlib==3.11.1",
    "numpy==2.4.6",
    "openinference-instrumentation-langchain==0.1.70",
    "openinference-instrumentation-openai==0.1.54",
    "opentelemetry-exporter-otlp==1.42.1",
    "opentelemetry-instrumentation==0.63b1",
    "opentelemetry-sdk==1.42.1",
    "pandas==3.0.5",
    "pyarrow==25.0.0",
    "pydantic==2.13.4",
    "pydantic-settings>=2.7,<3.0",
    "prometheus-client>=0.21,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "PyYAML==6.0.3",
    "redis>=5.3,<6.0",
    "requests>=2.32,<3.0",
    "scikit-learn==1.9.0",
    "scipy==1.17.1",
    "seaborn==0.13.2",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "tiktoken>=0.13,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
    "xgboost==3.2.0",
]

[project.scripts]
dtest-agent = "cli:main"
dtest-agent-api = "run:main"

[dependency-groups]
dev = [
    "pytest>=8.4,<10.0",
    "pytest-asyncio>=1.4,<2.0",
]

[tool.setuptools]
package-dir = { "" = ".", app = "src/app" }
py-modules = ["agent_config", "config", "cli", "run"]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["app*"]
exclude = ["app.test*"]

[tool.setuptools.package-data]
app = ["**/*.md", "**/*.yaml", "static/*.html", "context/tokenizers/*.tiktoken"]
