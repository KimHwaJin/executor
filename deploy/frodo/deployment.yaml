# One container per Pod: it serves the REST API and runs the Worker. The
# platform's CPU HPA owns the replica count, so none is set here (a fresh
# apply starts one Pod and a re-apply leaves the HPA's count alone). Every
# Pod shares PostgreSQL, Redis, the credential key and the RWX claim; a
# stopping Pod hands its running Steps to another one, so scale-in and
# rollouts lose no work. Each Pod opens up to 16 PostgreSQL connections.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  labels:
    app.kubernetes.io/name: executor
spec:
  revisionHistoryLimit: 3
  strategy:
    # A release whose migration drops a column or constraint deploys with
    # Recreate instead (deploy/kubernetes/README.md, Release order).
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: executor
  template:
    metadata:
      labels:
        app.kubernetes.io/name: executor
    spec:
      automountServiceAccountToken: false
      # preStop 5s + open HTTP requests 20s + Worker drain 30s + shutdown
      # cleanup 20s = 75s; raise this with any of those settings.
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          # REPLACE: the image built from this repository, by immutable tag.
          image: REPLACE_REGISTRY/executor-service:REPLACE_TAG
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          # Settings come from config.yml and config.dev.yml in the image
          # (docker build --build-arg APP_ENV=dev); APP_ENV must match it.
          env:
            - name: APP_ENV
              value: dev
          lifecycle:
            preStop:
              # Keep serving until the Service and gateway stop routing here.
              exec:
                command: ["sleep", "5"]
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            # 10 minutes for the migration lock wait, migrations and Worker start.
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            # Ready once the schema is current and the Worker accepts work;
            # a draining Pod turns unready.
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          # HPA compares usage with the request. One Python process tops out
          # near one core (GIL); the limit leaves headroom for bursts.
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 1500m
              memory: 2Gi
          volumeMounts:
            - name: shared-storage
              mountPath: /mnt/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            # The RWX claim pr-agentic-service and pr-batch mount at /mnt/data.
            claimName: executor-shared-pvc
        - name: tmp
          emptyDir: {}
