# Copy to secret.yaml (Git-ignored), fill in, and apply; never commit the copy.
# Each key becomes an environment variable, which wins over the config files.
apiVersion: v1
kind: Secret
metadata:
  name: executor-secrets
  labels:
    app.kubernetes.io/name: executor
type: Opaque
stringData:
  # URL-encode special characters in user names and passwords.
  DATABASE_URL: "postgresql+psycopg://REPLACE_USER:REPLACE_PASSWORD@postgresql.infra.svc.cluster.local:5432/executor"
  REDIS_URL: "redis://:REPLACE_PASSWORD@redis-master.infra.svc.cluster.local:6379/3"
  # Fernet key; keep it stable while encrypted Runtime credentials exist. Generate with
  # python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  RUNTIME_CREDENTIAL_KEY: REPLACE_WITH_FERNET_KEY
