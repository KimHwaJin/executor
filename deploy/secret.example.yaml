  EW_DATABASE_URL: postgresql://USER:PASSWORD@POSTGRES_HOST:5432/agent
  EW_REDIS_URL: redis://:PASSWORD@REDIS_HOST:6379/0
  REDIS_URL: redis://:PASSWORD@REDIS_HOST:6379/0
