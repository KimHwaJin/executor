apiVersion: v1
kind: Secret
metadata:
  name: dtest-agent-secrets
type: Opaque
stringData:
  DATABASE_URL: postgresql+asyncpg://USER:PASSWORD@POSTGRES_HOST:5432/chat_app
  CHECKPOINT_DB_URI: postgresql://USER:PASSWORD@POSTGRES_HOST:5432/chat_app?sslmode=disable
