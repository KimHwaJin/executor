apiVersion: v1
kind: ConfigMap
metadata:
  name: dtest-agent-config
data:
  APP_ENV: production
  SERVER_HOST: 0.0.0.0
  SERVER_PORT: "8000"
  SERVER_RELOAD: "false"
  AGENT_WORKER_ENABLED: "true"
  TASK_RECONCILER_ENABLED: "true"
  GRAPH_CHECKPOINTER: postgres
  # Checkpoint schema는 배포 전 1회 bootstrap한다. 요청 처리 중 CONCURRENTLY DDL을 실행하지 않는다.
  CHECKPOINT_SETUP_ON_START: "false"
  LANGGRAPH_STRICT_MSGPACK: "true"
  EXECUTOR_SHARED_INPUT_ROOT: /workspace/pv
  EW_NAMESPACE: dtest-agent
  EW_EXECUTOR_EVENT_STREAM: executor.events
  EW_EVENT_GROUP_NAME: dtest-agent:ingress
  EW_COMMAND_STREAM_NAME: dtest-agent:commands
  EW_COMMAND_GROUP_NAME: dtest-agent:dispatch
  EW_INGRESS_CONCURRENCY: "4"
  EW_DISPATCH_CONCURRENCY: "4"
  EW_POOL_SIZE: "8"
  EW_BATCH_SIZE: "100"
  EW_HEALTH_PORT: "8011"
  EW_RETENTION_DAYS: "14"
  # API와 Worker 공통 tenant(docs/handover/tenant-event-routing.md 참고)
  EXECUTOR_TENANT_ID: dtest
  AGENT_REPORT_ENABLED: "false"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtest-agent-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dtest-agent
      component: api
  template:
    metadata:
      labels:
        app: dtest-agent
        component: api
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: crud-migration
          image: dtest-agent:latest
          command: ["python", "-m", "alembic", "-c", "alembic.crud.ini", "upgrade", "head"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          envFrom:
            - configMapRef:
                name: dtest-agent-config
            - secretRef:
                name: dtest-agent-secrets
        - name: worker-migration
          image: dtest-agent:latest
          command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          envFrom:
            - configMapRef:
                name: dtest-agent-config
            - secretRef:
                name: dtest-agent-secrets
        - name: api-checkpoint-bootstrap
          image: dtest-agent:latest
          command: ["python", "-c"]
          args:
            - |-
              import asyncio, os
              from langgraph.checkpoint.postgres.aio import AsyncPostgresSaver
              async def main():
                  async with AsyncPostgresSaver.from_conn_string(os.environ['CHECKPOINT_DB_URI']) as saver:
                      await saver.setup()
              asyncio.run(main())
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          envFrom:
            - configMapRef:
                name: dtest-agent-config
            - secretRef:
                name: dtest-agent-secrets
      containers:
        - name: api
          image: dtest-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "uvicorn"]
          args: ["main:app", "--app-dir", "/app/src", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: dtest-agent-config
            - secretRef:
                name: dtest-agent-secrets
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: executor-shared
              mountPath: /workspace/pv
      volumes:
        - name: executor-shared
          persistentVolumeClaim:
            claimName: dtest-shared-pv
---
apiVersion: v1
kind: Service
metadata:
  name: dtest-agent-api
spec:
  selector:
    app: dtest-agent
    component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dtest-agent-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dtest-agent
      component: worker
  template:
    metadata:
      labels:
        app: dtest-agent
        component: worker
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: worker-migration
          image: dtest-agent:latest
          command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          envFrom:
            - configMapRef:
                name: dtest-agent-config
            - secretRef:
                name: dtest-agent-secrets
        - name: worker-checkpoint-bootstrap
          image: dtest-agent:latest
          command: ["python", "-c"]
          args:
            - |-
              import asyncio, os
              from langgraph.checkpoint.postgres.aio import AsyncPostgresSaver
              async def main():
                  async with AsyncPostgresSaver.from_conn_string(os.environ['AGENT_CHECKPOINT_DATABASE_URL']) as saver:
                      await saver.setup()
              asyncio.run(main())
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          envFrom:
            - configMapRef:
                name: dtest-agent-config
            - secretRef:
                name: dtest-agent-secrets
      containers:
        - name: worker
          image: dtest-agent:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.agent_worker.worker_main"]
          envFrom:
            - configMapRef:
                name: dtest-agent-config
            - secretRef:
                name: dtest-agent-secrets
          ports:
            - name: health
              containerPort: 8011
          readinessProbe:
            httpGet:
              path: /health/ready
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/live
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          volumeMounts:
            - name: executor-shared
              mountPath: /workspace/pv
      volumes:
        - name: executor-shared
          persistentVolumeClaim:
            claimName: dtest-shared-pv
