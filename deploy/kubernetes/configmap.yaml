apiVersion: v1
kind: ConfigMap
metadata:
  name: executor-config
  labels:
    app.kubernetes.io/name: executor
data:
  APP_ENV: production
  LOG_LEVEL: INFO
  HOST: 0.0.0.0
  PORT: "8000"

  DATABASE_POOL_SIZE: "10"
  DATABASE_MAX_OVERFLOW: "5"
  DATABASE_POOL_TIMEOUT_SECONDS: "30"
  DATABASE_POOL_RECYCLE_SECONDS: "1800"
  DATABASE_CONNECT_TIMEOUT_SECONDS: "10"

  REDIS_WORK_STREAM: executor.work
  REDIS_EVENT_STREAM: executor.events
  REDIS_WORK_DEAD_LETTER_STREAM: executor.work.dlq
  REDIS_EVENT_DEAD_LETTER_STREAM: executor.events.dlq
  OUTBOX_POLL_INTERVAL_SECONDS: "0.5"
  OUTBOX_BATCH_SIZE: "100"

  # Include the Service Host header and every internal Gateway/Ingress hostname used for /mcp.
  MCP_ALLOWED_HOSTS: executor:*,executor.example.internal:*
  MCP_ALLOWED_ORIGINS: https://agent.example.internal

  SHARED_STORAGE_ROOT: /workspace/shared
  RUNTIME_SESSION_COUNT_MAX_AGE_SECONDS: "45"
  RUNTIME_CLEANUP_RETRY_INTERVAL_SECONDS: "60"
  EXECUTION_INLINE_SPEC_MAX_BYTES: "262144"
  EXECUTION_FILE_SPEC_MAX_BYTES: "52428800"
  EXECUTION_MAX_STEPS_PER_OPERATION: "100"
  EXECUTION_MAX_STEPS_PER_EXECUTION: "1000"
  EXECUTION_CONSUMER_GROUP: executor-workers
  EXECUTION_PENDING_CLAIM_INTERVAL_SECONDS: "5"
  EXECUTION_PENDING_CLAIM_IDLE_MILLISECONDS: "30000"
  EXECUTION_PENDING_CLAIM_BATCH_SIZE: "100"
  EXECUTION_LEASE_SECONDS: "60"
  EXECUTION_HEARTBEAT_SECONDS: "15"
  EXECUTION_DRAIN_TIMEOUT_SECONDS: "30"
  EXECUTION_SHUTDOWN_CLEANUP_SECONDS: "20"
  RUNTIME_ABORT_TIMEOUT_SECONDS: "15"
  RUNTIME_MAX_OUTPUT_MESSAGE_BYTES: "33554432"
  FAILED_SESSION_RETENTION_SECONDS: "3600"
  EXECUTION_MAX_RUNTIME_SECONDS: "432000"

  TRACING_ENABLED: "false"
  OTEL_SERVICE_NAME: executor-service
  OTEL_PROJECT_NAME: executor-service
  OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix.example.internal:6006/v1/traces
  OTEL_EXPORTER_TIMEOUT_SECONDS: "5"
  OTEL_SAMPLE_RATIO: "1.0"
