# Example only. Copy this file outside Git, replace every value, and create executor-secret.
# Prefer the internal platform's Secret manager rather than committing a populated manifest.
apiVersion: v1
kind: Secret
metadata:
  name: executor-secret
  labels:
    app.kubernetes.io/name: executor
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://REPLACE_USER:REPLACE_PASSWORD@postgres.example.internal:5432/executor
  REDIS_URL: redis://:REPLACE_PASSWORD@redis.example.internal:6379/0
  RUNTIME_CREDENTIAL_KEY: REPLACE_WITH_FERNET_KEY
