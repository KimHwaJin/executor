apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  labels:
    app.kubernetes.io/name: executor
    app.kubernetes.io/component: application
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    # Migrations are backward compatible and running Steps hand over between Pods.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: executor
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: executor
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          # CI/CD must replace this with the immutable image built from this repository.
          image: executor-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          # Settings come from config.prd.yml baked into the image; the platform
          # offers no ConfigMaps or Secrets. Environment variables still override.
          env:
            - name: APP_ENV
              value: "prd"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            # Includes DB lock wait, migration execution and Worker initialization.
            failureThreshold: 120
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            # Agent and Executor share requests and immutable execution results.
            - name: shared-storage
              mountPath: /mnt/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: shared-storage
          persistentVolumeClaim:
            # This RWX claim must also be mounted by the Agent.
            claimName: executor-shared-pvc
        - name: tmp
          emptyDir: {}
