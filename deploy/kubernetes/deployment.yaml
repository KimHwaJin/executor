apiVersion: apps/v1
kind: Deployment
metadata:
  name: executor
  labels:
    app.kubernetes.io/name: executor
    app.kubernetes.io/component: application
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: executor
      app.kubernetes.io/component: application
  template:
    metadata:
      labels:
        app.kubernetes.io/name: executor
        app.kubernetes.io/component: application
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 90
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: executor
          # CI/CD must replace this with the immutable image built from this repository.
          image: executor-service:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          envFrom:
            - configMapRef:
                name: executor-config
            - secretRef:
                name: executor-secret
          env:
            # Consumer group is shared; the Pod name must be unique for each worker process.
            - name: EXECUTION_CONSUMER_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 24
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            # Agent writes PATH sources; Executor only reads them.
            - name: input
              mountPath: /workspace/input
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: input
          persistentVolumeClaim:
            # This existing claim must be mounted read-write by the Agent.
            claimName: executor-input-pvc
        - name: tmp
          emptyDir: {}
