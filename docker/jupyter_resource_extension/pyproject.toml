[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "executor-jupyter-resource-extension"
version = "0.1.0"
description = "Authenticated Jupyter Server resource status endpoint for Executor"
requires-python = ">=3.10"
dependencies = [
    "jupyter-server>=2,<3",
    "psutil>=5.9,<8",
    "tornado>=6.3,<7",
]

[tool.setuptools.packages.find]
where = ["src"]
